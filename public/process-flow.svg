<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#245c4f"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a948f"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="54" font-size="30" font-weight="700" fill="#1d2421">MasterGraph: from request to SAP Business One</text>
  <text x="40" y="84" font-size="16" fill="#6b736f">Built on what Lives Group already uses: Outlook and Teams (Microsoft 365) and SAP B1.</text>

  <!-- Lanes -->
  <g font-size="15" font-weight="700" fill="#1d2421">
    <rect x="20" y="110" width="1560" height="120" fill="#f7f7f4"/>
    <rect x="20" y="236" width="1560" height="184" fill="#e6efeb"/>
    <rect x="20" y="426" width="1560" height="124" fill="#f7f7f4"/>
    <rect x="20" y="556" width="1560" height="104" fill="#ffffff" stroke="#ecece6"/>
    <rect x="20" y="666" width="1560" height="124" fill="#f7f7f4"/>
    <text x="40" y="160">Requestor</text><text x="40" y="180" font-size="12" font-weight="400" fill="#6b736f">Sales, Product, Procurement</text>
    <text x="40" y="300" fill="#245c4f">MasterGraph</text><text x="40" y="320" font-size="12" font-weight="400" fill="#245c4f">the new layer</text>
    <text x="40" y="475">Approvers</text><text x="40" y="495" font-size="12" font-weight="400" fill="#6b736f">in Microsoft Teams</text>
    <text x="40" y="598">MDM team</text><text x="40" y="618" font-size="12" font-weight="400" fill="#6b736f">Priya and team</text>
    <text x="40" y="720">SAP Business One</text><text x="40" y="740" font-size="12" font-weight="400" fill="#6b736f">shared ERP, all entities</text>
  </g>

  <!-- Main flow arrows (drawn first, under boxes) -->
  <g stroke="#245c4f" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M325,205 L325,268"/>
    <path d="M420,315 L462,315"/>
    <path d="M660,315 L702,315"/>
    <path d="M805,350 L805,490 L942,490"/>
    <path d="M1140,490 L1285,490 L1285,567"/>
    <path d="M1285,640 L1285,687"/>
    <path d="M1380,722 L1500,722 L1500,358"/>
  </g>
  <!-- Supporting links -->
  <g stroke="#8a948f" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow-grey)">
    <path d="M565,567 L565,520 L700,520 L700,352"/>
    <path d="M660,610 L1045,610 L1045,538"/>
    <path d="M1045,455 L1045,358"/>
    <path d="M1045,280 L1045,213"/>
  </g>

  <!-- Step boxes -->
  <g font-size="12" fill="#6b736f">
    <!-- 1 Requestor -->
    <rect x="230" y="135" width="190" height="70" rx="10" fill="#fff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="246" y="162" font-size="15" font-weight="700" fill="#1d2421">1  Email or form</text>
    <text x="246" y="182">Outlook, as today,</text><text x="246" y="197">or the MasterGraph form</text>

    <!-- 2 Sort -->
    <rect x="230" y="270" width="190" height="80" rx="10" fill="#fff" stroke="#245c4f" stroke-width="1.5"/>
    <text x="246" y="297" font-size="15" font-weight="700" fill="#1d2421">2  Sort the email</text>
    <text x="246" y="317">Purchase order, enquiry</text><text x="246" y="332">or new record setup</text>
    <text x="236" y="375" font-size="11" fill="#245c4f">Orders → sales desk (demand)</text>
    <text x="236" y="392" font-size="11" fill="#245c4f">Enquiries → pipeline only</text>

    <!-- 3 Search -->
    <rect x="470" y="270" width="190" height="80" rx="10" fill="#fff" stroke="#245c4f" stroke-width="1.5"/>
    <text x="486" y="297" font-size="15" font-weight="700" fill="#1d2421">3  Search first</text>
    <text x="486" y="317">Duplicate check across</text><text x="486" y="332">SPD, QTS and QTG</text>
    <text x="476" y="375" font-size="11" fill="#b4432f">Already exists? Reuse it,</text>
    <text x="476" y="392" font-size="11" fill="#b4432f">no new record created</text>

    <!-- 4 Form -->
    <rect x="710" y="270" width="190" height="80" rx="10" fill="#fff" stroke="#245c4f" stroke-width="1.5"/>
    <text x="726" y="297" font-size="15" font-weight="700" fill="#1d2421">4  One complete form</text>
    <text x="726" y="317">Every required field;</text><text x="726" y="332">credit and bank locked</text>

    <!-- Status & audit -->
    <rect x="950" y="280" width="190" height="70" rx="10" fill="#fff" stroke="#245c4f" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="966" y="306" font-size="15" font-weight="700" fill="#1d2421">Live status + audit</text>
    <text x="966" y="326">Who has it, for how long,</text><text x="966" y="341">who approved and when</text>

    <!-- Requestor sees status -->
    <rect x="950" y="143" width="190" height="62" rx="10" fill="#fff" stroke="#cfd6d2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="966" y="170" font-size="15" font-weight="700" fill="#1d2421">Sees status anytime</text>
    <text x="966" y="190">No more “any update?”</text>

    <!-- 5 Teams approvals -->
    <rect x="950" y="455" width="190" height="75" rx="10" fill="#fff" stroke="#5b5fc7" stroke-width="2"/>
    <text x="966" y="482" font-size="15" font-weight="700" fill="#1d2421">5  Approve in Teams</text>
    <text x="966" y="502">Sales → Finance → BU Head</text><text x="966" y="517" fill="#5b5fc7">48h no reply → escalate</text>

    <!-- Rules -->
    <rect x="470" y="567" width="190" height="75" rx="10" fill="#fff" stroke="#cfd6d2" stroke-width="1.5"/>
    <text x="486" y="594" font-size="15" font-weight="700" fill="#1d2421">Rules (no IT)</text>
    <text x="486" y="614">Add fields, approval steps,</text><text x="486" y="629">new business units</text>

    <!-- 6 Final check -->
    <rect x="1190" y="575" width="190" height="65" rx="10" fill="#fff" stroke="#245c4f" stroke-width="1.5"/>
    <text x="1206" y="602" font-size="15" font-weight="700" fill="#1d2421">6  MDM final check</text>
    <text x="1206" y="622">One click, no retyping</text>

    <!-- 7 SAP B1 -->
    <rect x="1190" y="690" width="190" height="80" rx="10" fill="#245c4f"/>
    <text x="1206" y="717" font-size="15" font-weight="700" fill="#ffffff">7  Created in SAP B1</text>
    <text x="1206" y="737" fill="#d8e9e2">Service Layer API:</text><text x="1206" y="752" fill="#d8e9e2">BusinessPartners · Items</text>

    <!-- Regional view -->
    <rect x="1400" y="270" width="170" height="88" rx="10" fill="#fbf1e1" stroke="#b7791f" stroke-width="1.5"/>
    <text x="1414" y="296" font-size="15" font-weight="700" fill="#1d2421">Regional view</text>
    <text x="1414" y="316" fill="#6f4a12">Confirmed POs by</text><text x="1414" y="331" fill="#6f4a12">country, product, entity;</text><text x="1414" y="346" fill="#6f4a12">forecast + actions</text>
    <text x="1512" y="560" font-size="11" fill="#245c4f" transform="rotate(-90 1512 560)">Clean records + orders feed analytics</text>
  </g>

  <!-- Footer -->
  <g font-size="13" fill="#6b736f">
    <line x1="40" y1="815" x2="1560" y2="815" stroke="#e6e6e0"/>
    <path d="M40,845 L80,845" stroke="#245c4f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="92" y="850">Request flow</text>
    <path d="M220,845 L260,845" stroke="#8a948f" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-grey)"/><text x="272" y="850">Configures or updates</text>
    <text x="470" y="850">Before: ~18 days by email, no status, retyped into SAP.  After: ~3.5 days, tracked end to end, pushed to SAP B1.</text>
  </g>
</svg>
